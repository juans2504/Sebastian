<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laboratorio XR - Fase 2 - Cadena de Producción</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcf">

      <!-- Piso de la fábrica -->
      <a-plane rotation="-90 0 0" width="30" height="30" color="#DCDCDC" shadow="receive: true"></a-plane>
      <a-sky color="#CFE8F0"></a-sky>

      <!-- Iluminación: ambiente suave + luz direccional que genera sombras -->
      <a-entity light="type: ambient; intensity: 0.6; color: #FFFFFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; castShadow: true" position="3 6 2"></a-entity>

      <!-- ===================================================== -->
      <!-- SUBSISTEMA 1: Banda Transportadora                     -->
      <!-- Girada 90° -> queda perpendicular al brazo del robot   -->
      <!-- Recorre el eje Z y entrega las piezas al robot         -->
      <!-- ===================================================== -->
      <a-entity id="banda-transportadora" position="2.3 0 -3.7" rotation="0 90 0" shadow="cast: true">

        <!-- Patas / soportes en ambos extremos -->
        <a-box position="-2.3 0.4 0.4"  width="0.2" height="0.8" depth="0.2" color="#3B3B3B"></a-box>
        <a-box position="-2.3 0.4 -0.4" width="0.2" height="0.8" depth="0.2" color="#3B3B3B"></a-box>
        <a-box position="2.3 0.4 0.4"   width="0.2" height="0.8" depth="0.2" color="#3B3B3B"></a-box>
        <a-box position="2.3 0.4 -0.4"  width="0.2" height="0.8" depth="0.2" color="#3B3B3B"></a-box>

        <!-- Soporte central adicional (más realismo) -->
        <a-box position="0 0.4 0.4"  width="0.15" height="0.8" depth="0.15" color="#3B3B3B"></a-box>
        <a-box position="0 0.4 -0.4" width="0.15" height="0.8" depth="0.15" color="#3B3B3B"></a-box>

        <!-- Rodillos: fila continua, cruzando el ancho de la banda (eje correcto) -->
        <a-cylinder position="-2.30 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-2.05 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-1.80 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-1.55 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-1.30 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-1.05 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-0.80 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-0.55 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-0.30 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="-0.05 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="0.20 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="0.45 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="0.70 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="0.95 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="1.20 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="1.45 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="1.70 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="1.95 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>
        <a-cylinder position="2.20 0.85 0" radius="0.09" height="0.95" rotation="90 0 0" color="#FF6F00"></a-cylinder>

        <!-- Superficie de la banda -->
        <a-box position="0 0.9 0" width="4.6" height="0.06" depth="0.9" color="#1A1A1A" shadow="cast: true"></a-box>

        <!-- Barandas laterales de seguridad (franjas amarillo/negro) -->
        <a-box position="0 1.05 0.48" width="4.6" height="0.1" depth="0.04" color="#FFD400"></a-box>
        <a-box position="0 1.05 -0.48" width="4.6" height="0.1" depth="0.04" color="#FFD400"></a-box>

        <!-- Piezas en camino hacia el robot -->
        <a-box position="-1.5 1.05 0" width="0.3" height="0.3" depth="0.3" color="#4CC3D9" shadow="cast: true"></a-box>
        <a-box position="0.3 1.05 0"  width="0.3" height="0.3" depth="0.3" color="#4CC3D9" shadow="cast: true"></a-box>

        <!-- Sensor óptico al final de la banda, justo antes del robot -->
        <a-sphere position="2.3 1.45 0" radius="0.1" color="#39FF14"></a-sphere>

      </a-entity>

      <!-- ===================================================== -->
      <!-- SUBSISTEMA 2: Brazo Robotizado                          -->
      <!-- Recibe las piezas justo donde termina la banda           -->
      <!-- ===================================================== -->
      <a-entity id="brazo-robotizado" position="4.85 0.25 -6.3" rotation="0 180 0" shadow="cast: true">

        <!-- Pedestal que eleva al robot para que la pinza quede a la altura de la banda -->
        <a-box position="0 -0.125 0" width="1.3" height="0.25" depth="1.3" color="#2B2B2B" shadow="cast: true"></a-box>

        <!-- Base fija -->
        <a-cylinder position="0 0.15 0" radius="0.6" height="0.3" color="#3B3B3B"></a-cylinder>

        <!-- Columna vertical -->
        <a-cylinder position="0 0.75 0" radius="0.2" height="1" color="#FF6F00"></a-cylinder>

        <!-- Articulación 1 (hombro) -->
        <a-sphere position="0 1.25 0" radius="0.22" color="#EF2D5E"></a-sphere>

        <!-- Segmento 1: brazo principal -->
        <a-box position="0.7 1.25 0" width="1.4" height="0.25" depth="0.25" color="#4CC3D9"></a-box>

        <!-- Articulación 2 (codo) -->
        <a-sphere position="1.4 1.25 0" radius="0.18" color="#EF2D5E"></a-sphere>

        <!-- Segmento 2: antebrazo -->
        <a-box position="1.95 1.05 0" rotation="0 0 -20" width="1" height="0.18" depth="0.18" color="#4CC3D9"></a-box>

        <!-- Articulación 3 (muñeca) -->
        <a-sphere position="2.4 0.9 0" radius="0.14" color="#EF2D5E"></a-sphere>

        <!-- Pinza (dos dedos) -->
        <a-box position="2.55 0.75 0.08" width="0.08" height="0.3" depth="0.08" color="#7BC8A4"></a-box>
        <a-box position="2.55 0.75 -0.08" width="0.08" height="0.3" depth="0.08" color="#7BC8A4"></a-box>

        <!-- Pieza recién recogida de la banda -->
        <a-box position="2.55 0.55 0" width="0.25" height="0.25" depth="0.25" color="#EF2D5E"></a-box>

      </a-entity>

      <!-- Cámara ubicada para ver toda la línea de producción en L -->
      <a-entity camera position="0 1.6 0" rotation="0 -35 0" look-controls wasd-controls></a-entity>

    </a-scene>
  </body>
</html>
