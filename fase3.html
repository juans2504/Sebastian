<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laboratorio XR - Fase 3 - Modelo CAD</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene shadow="type: pcf" webxr="optionalFeatures: hit-test, local-floor;" ar-hit-test="target:#anclaCAD; type:map; mapSize:0.5 0.5;">

      <!-- Piso -->
      <a-plane rotation="-90 0 0" width="20" height="20" color="#DCDCDC" shadow="receive: true"></a-plane>
      <a-sky color="#CFE8F0"></a-sky>

      <!-- Iluminación -->
      <a-entity light="type: ambient; intensity: 1.0; color: #FFFFFF"></a-entity>
      <a-entity light="type: hemisphere; intensity: 0.8; color: #FFFFFF; groundColor: #444444"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; castShadow: true" position="3 6 2"></a-entity>

      <a-assets>
        <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
      </a-assets>

      <!-- Entidad "ancla": esta es la que ar-hit-test mueve al punto real que toques
           cuando estás en AR. Ya NO empieza oculta, así que en la vista normal del
           navegador (o VR) se ve de inmediato en su posición de prueba (0 0 -4). -->
      <a-entity id="anclaCAD" position="0 0 -4">
        <!-- El modelo CAD va DENTRO de la ancla. auto-fit-suelo ajusta su escala
             y lo centra/apoya en el ORIGEN LOCAL de la ancla (0 0 0), así que
             sin importar a dónde mueva la ancla el hit-test, el modelo siempre
             queda bien parado justo en ese punto. -->
        <a-entity
          id="modeloCAD"
          gltf-model="#modeloIndustrial"
          rotation="90 0 0"
          auto-fit-suelo="tamanoObjetivo: 2"
          shadow="cast: true; receive: true">
        </a-entity>
      </a-entity>

      <!-- Cámara -->
      <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>

    </a-scene>

    <script>
      AFRAME.registerComponent('auto-fit-suelo', {
        schema: {
          tamanoObjetivo: { type: 'number', default: 1.5 } // tamaño deseado en metros (el lado más grande)
        },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            console.log('[auto-fit-suelo] evento model-loaded recibido');
            const obj3D = this.el.getObject3D('mesh');
            if (!obj3D) {
              console.warn('[auto-fit-suelo] No se encontró el objeto "mesh". El modelo no cargó bien.');
              return;
            }

            // 0. Guardar la posición X/Z deseada (la que pusiste en el atributo "position")
            //    ANTES de tocar nada, para saber a dónde debe quedar centrado el modelo.
            const posDeseada = this.el.object3D.position.clone();

            // IMPORTANTE: forzamos la actualización de la matriz de transformación
            // (rotación/posición/escala) ANTES de medir. Si no hacemos esto, Box3 puede
            // usar datos desactualizados (por ejemplo, la rotación aún no aplicada),
            // dando medidas y centros incorrectos.
            this.el.object3D.updateMatrixWorld(true);

            // 1. Medir el tamaño actual del modelo (con la rotación ya aplicada)
            const box1 = new THREE.Box3().setFromObject(obj3D);
            const size1 = new THREE.Vector3();
            box1.getSize(size1);

            const ladoMasGrande = Math.max(size1.x, size1.y, size1.z);
            console.log('[auto-fit-suelo] tamaño medido (antes de escalar):', size1, 'lado más grande:', ladoMasGrande);

            if (!isFinite(ladoMasGrande) || ladoMasGrande <= 0) {
              console.warn('[auto-fit-suelo] Medida inválida, no se puede escalar. Se deja el modelo sin tocar.');
              return;
            }

            // 2. Escalar para que el lado más grande mida "tamanoObjetivo" metros
            const factor = this.data.tamanoObjetivo / ladoMasGrande;
            console.log('[auto-fit-suelo] factor de escala calculado:', factor);

            if (!isFinite(factor) || factor <= 0) {
              console.warn('[auto-fit-suelo] Factor de escala inválido:', factor, '. No se aplica escala.');
              return;
            }

            this.el.object3D.scale.set(factor, factor, factor);

            // Volvemos a forzar la actualización de la matriz después de escalar,
            // por la misma razón: si no lo hacemos, la siguiente medición (box2)
            // puede seguir reflejando el tamaño ANTES de escalar.
            this.el.object3D.updateMatrixWorld(true);

            // 3. Volver a medir DESPUÉS de escalar: como el pivote del modelo puede no
            //    estar en su centro geométrico, necesitamos el centro real (X, Z) y el
            //    punto más bajo (Y) para saber cuánto hay que mover el objeto.
            const box2 = new THREE.Box3().setFromObject(obj3D);
            const centro2 = new THREE.Vector3();
            box2.getCenter(centro2);
            const minY2 = box2.min.y;

            // 4. Calcular cuánto falta mover en cada eje:
            //    - X y Z: para que el CENTRO del modelo quede en la posición deseada
            //    - Y: para que el punto más BAJO del modelo toque el piso (y = 0)
            const deltaX = posDeseada.x - centro2.x;
            const deltaZ = posDeseada.z - centro2.z;
            const deltaY = 0 - minY2;

            console.log('[auto-fit-suelo] centro medido:', centro2, 'minY:', minY2);
            console.log('[auto-fit-suelo] deltas a aplicar:', { deltaX, deltaY, deltaZ });

            if (![deltaX, deltaY, deltaZ].every(isFinite)) {
              console.warn('[auto-fit-suelo] Delta inválido, no se mueve el modelo para evitar que desaparezca.');
              return;
            }

            this.el.object3D.position.x += deltaX;
            this.el.object3D.position.y += deltaY;
            this.el.object3D.position.z += deltaZ;

            this.el.object3D.updateMatrixWorld(true);

            console.log('[auto-fit-suelo] posición final:', this.el.object3D.position, 'escala final:', this.el.object3D.scale);
          });
        }
      });
    </script>
  </body>
</html>
